<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumb & Quill Vault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🍪 Crumb & Quill Vault</h1>

        <p class="subtitle">
            Recipe Library • Yield Calculator • Notes
        </p>

        <div class="card">

            <h2>Recipes</h2>

            <select id="recipeSelect">
                <option>Select a recipe</option>
                
                <option>Classic Chocolate Chip</option>
                <option>Classic Chocolate Chip Walnut </option>
                <option>Red Velvet Creamcheese</option>
                <option>Biscoff Affair</option>
                <option>Strawberry Matcha Cloud</option>
                <option>Cookie Dough Cinnamon Roll</option>
            </select>

        </div>

        <div class="card">

            <h2>Yield Calculator</h2>

            <label>Desired Quantity</label>

            <input
                type="number"
                id="desiredYield"
                placeholder="Example: 40"
            >

            <button id="calculateBtn">
                Calculate
            </button>

        </div>

       <div class="card">
    <h2>Original Recipe</h2>
    <div id="recipeInfo">Select a recipe first.</div>
</div>

<div class="card">
    <h2>Scaled Ingredients</h2>
    <div id="ingredientsOutput">Select a recipe first.</div>
</div>

<div class="card">
    <h2>Notes</h2>
    <div id="notesOutput">No notes yet.</div>
</div>

    </div>

    <script src="recipe.js"></script>
    <script src="app.js"></script>

</body>
</html>
